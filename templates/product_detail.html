<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.title }} - Shade Nova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <a href="/" class="btn btn-outline-secondary mb-4">&larr; Back to Shop</a>
        <div class="row bg-white p-4 rounded shadow-sm">
            <div class="col-md-6 text-center">
                <div class="bg-secondary text-white p-5 rounded d-flex align-items-center justify-content-center" style="min-height: 250px;">
                    <h3>[ Product Image ]</h3>
                </div>
            </div>
            <div class="col-md-6">
                <span class="badge bg-primary mb-2">Eyewear</span>
                <h2 class="fw-bold">{{ product.title }}</h2>
                <h3 class="text-success my-3">₹{{ product.price }}</h3>
                <p class="text-muted">{{ product.description }}</p>
                <button class="btn btn-primary btn-lg w-100 mt-3">Add to Cart</button>
            </div>
        </div>
    </div>
</body>
</html>
