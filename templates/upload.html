<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Product | Shade Nova</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px; text-align: center; }
        form { background: white; padding: 30px; display: inline-block; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h2>Add New Product to Shade Nova</h2>
    <form action="/admin/upload" method="POST" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="Product Name (e.g. Aviator Glasses)" required>
        <input type="number" step="0.01" name="price" placeholder="Price (₹)" required>
        <textarea name="description" placeholder="Product Description" rows="3"></textarea>
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Upload Product</button>
    </form>
</body>
</html>
