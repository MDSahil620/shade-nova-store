<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shade Nova Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="/">Shade Nova Store</a>
        <a href="/admin" class="btn btn-outline-light btn-sm">Admin Login</a>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Shade Nova Store</h1>
            <p class="text-muted">Official Storefront</p>
        </div>

        <div class="row">
            {% for product in products %}
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100 p-3">
                    <div class="card-body">
                        <h3 class="card-title fw-bold text-primary mb-3">{{ product.title }}</h3>
                        <p class="card-text text-muted">{{ product.description }}</p>
                        <h4 class="text-success mb-3">₹{{ product.price }}</h4>
                        <a href="/product/{{ product.id }}" class="btn btn-primary">Buy Now</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
